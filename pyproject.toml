[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner"
version = "0.1.0"
description = "Travel planner powered by Zeus Engine and LLM agent loop"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.0",
    "httpx==0.28.1",
    "kotenai-zeus-client @ file:../zeus_client_python",  # sibling 2.4.0 in use (2.4.x family, ZCP-113 hub-join-v1)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
travel-planner = "travel_planner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_planner = ["templates/*", "static/*", "static/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: tests that require live Zeus or LLM services",
]

[tool.coverage.run]
source = ["travel_planner"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true