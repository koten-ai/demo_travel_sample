services:
  travel-planner:
    build:
      context: ..
      dockerfile: demo_travel_sample/Dockerfile
    container_name: travel-planner
    ports:
      - "5050:5000"
    environment:
      ENVIRONMENT: dev
      # Reach Zeus on the host from this container (matches config.example.json).
      # config.json zeus.url should also use host.docker.internal when running via Compose.
      ZEUS_URL: "http://host.docker.internal:8080"
      CHAT_LOG_PATH: "/app/data/chats.jsonl"
      ZEUS_CLIENT_CONFIG_DIR: "/app"
      ZEUS_CHAT_REQUESTS_DIR: "/app/data/chat_requests"
      PORT: "5000"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./src/travel_planner/templates:/app/src/travel_planner/templates
      - ./src/travel_planner/static:/app/src/travel_planner/static
      - ./src/travel_planner:/app/src/travel_planner
      - ./data/chat_requests:/app/data/chat_requests
      # Live sibling SDK (pipeline XML recovery). Restart the container after client edits.
      - ../zeus_client_python:/opt/zeus_client_python
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
